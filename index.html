<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Técnico iPhone">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icones/icone.svg" type="image/svg+xml">
<link rel="icon" href="icones/icone-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<title>Formação Técnico iPhone</title>
<meta name="description" content="Aprenda a consertar iPhone do zero com vídeo aulas práticas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--marca:#1e8bff;--marca-forte:#0a6cff;--fundo:#05070d;--borda:rgba(255,255,255,.07);--texto-2:#a3abba;--sucesso:#22c55e;--seguro-topo:env(safe-area-inset-top);--seguro-base:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fundo);color:#f5f7fa;font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
p,h1,h2,h3{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
.ic{display:block;flex-shrink:0}
.fundo-app{min-height:100dvh;background:radial-gradient(120% 50% at 80% -10%,rgba(30,110,255,.28),transparent 60%),radial-gradient(80% 40% at 0% 0%,rgba(30,80,200,.18),transparent 60%),var(--fundo)}
.tela{max-width:448px;margin:0 auto;padding:max(20px,var(--seguro-topo)) 16px 112px}
.cartao{background:linear-gradient(180deg,rgba(20,27,42,.9),rgba(10,14,23,.9));border:1px solid var(--borda)}
.r-xl{border-radius:12px}.r-2xl{border-radius:16px}
.t2{color:var(--texto-2)}.azul{color:var(--marca)}
.flex{display:flex;align-items:center}.col{display:flex;flex-direction:column}
.entre{justify-content:space-between}.g1{gap:4px}.g2{gap:8px}.g3{gap:12px}.g4{gap:16px}.g5{gap:20px}
.mt1{margin-top:4px}.mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}.mt5{margin-top:20px}.mt6{margin-top:24px}
.f1{flex:1;min-width:0}.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sem-scroll{scrollbar-width:none}.sem-scroll::-webkit-scrollbar{display:none}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;border-top:1px solid var(--borda);background:rgba(7,10,18,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding-bottom:var(--seguro-base)}
.nav ul{max-width:448px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0 10px;font-size:13px;color:#d4d4d4}
.nav a.ativo{color:var(--marca);font-weight:600}
/* cabeçalho de página */
.cab{display:flex;align-items:flex-start;gap:12px}
.cab h1{font-size:32px;font-weight:700;line-height:1.15}
.cab p{margin-top:4px;font-size:15px;line-height:1.35;color:var(--texto-2)}
.btn-ic{display:grid;place-items:center;border-radius:999px}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:20px -16px 0;padding:0 16px}
.chip{flex-shrink:0;border-radius:999px;padding:10px 20px;font-size:15px;background:rgba(255,255,255,.07);color:#e5e5e5}
.chip.ativo{background:var(--marca);color:#fff;font-weight:500;box-shadow:0 0 16px rgba(30,139,255,.5)}
.campo-busca{width:100%;margin-top:16px;padding:12px 16px;border-radius:12px;outline:none}
.campo-busca:focus{border-color:var(--marca)}
/* progresso */
.barra{height:6px;width:100%;border-radius:999px;background:rgba(255,255,255,.1)}
.barra>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--marca-forte),var(--marca));box-shadow:0 0 8px rgba(30,139,255,.6)}
.anel{position:relative;flex-shrink:0}
.anel span{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:700}
/* miniaturas */
.thumb{position:relative;overflow:hidden;background:linear-gradient(135deg,#1b3a7a,#0e1d3d 50%,#060a14)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.play-redondo{position:absolute;inset:0;margin:auto;width:48px;height:48px;border-radius:999px;background:rgba(0,0,0,.7);display:grid;place-items:center}
/* home */
.logo{display:flex;align-items:center;gap:12px}
.logo-ic{position:relative;width:48px;height:48px}
.logo-ic .chave{position:absolute;right:-4px;bottom:0;background:var(--fundo);border-radius:999px;padding:2px;color:var(--marca)}
.logo p{font-size:22px;font-weight:700;line-height:1.05;letter-spacing:-.01em}
.badge{position:absolute;top:-2px;right:-2px;width:20px;height:20px;border-radius:999px;background:#ef4444;font-size:11px;font-weight:700;display:grid;place-items:center}
.hero{position:relative;overflow:hidden;margin-top:20px;border-radius:16px;border:1px solid rgba(30,139,255,.3);padding:20px;background:linear-gradient(120deg,#0b1a3a 0%,#0b2a6b 55%,#0a1630 100%);box-shadow:0 0 30px rgba(30,110,255,.25)}
.hero .brilho{position:absolute;inset:0;background:radial-gradient(60% 80% at 85% 30%,rgba(60,140,255,.35),transparent 70%)}
.hero .foto{position:absolute;top:0;right:0;height:100%;width:62%;object-fit:cover;object-position:62% 18%}
.hero .fade{position:absolute;top:0;bottom:0;right:30%;width:32%;background:linear-gradient(90deg,#0b1d45,transparent)}
.hero .txt{position:relative;max-width:74%}
.hero h2{font-size:25px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero p{margin-top:8px;font-size:15px;line-height:1.35;color:#e5e5e5}
.btn-hero{margin-top:16px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border-radius:999px;background:var(--marca);padding:10px 20px;font-size:15px;font-weight:600;color:#04122b;box-shadow:0 0 18px rgba(30,139,255,.6)}
.btn-hero .bola{width:20px;height:20px;border-radius:999px;background:#04122b;display:grid;place-items:center;color:var(--marca)}
.recentes{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:12px -16px 0;padding:0 16px}
.recente{display:flex;gap:8px;width:92%;flex-shrink:0;scroll-snap-align:start}
.recente .thumb{width:58%;aspect-ratio:16/10;border-radius:12px;flex-shrink:0}
.recente .info{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:12px;border-radius:12px}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.atalhos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.atalhos a{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;border-radius:12px;text-align:center;font-size:12px;font-weight:500;line-height:1.2}
.ok-verde{color:#fff}
/* aulas / módulos */
.mod{display:flex;gap:12px;padding:10px;border-radius:16px}
.mod .thumb{width:112px;height:96px;border-radius:12px;flex-shrink:0}
.st{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;flex-shrink:0}
.st.ok{background:var(--sucesso)}.st.and{background:var(--marca);box-shadow:0 0 12px rgba(30,139,255,.7)}.st.lock{background:rgba(255,255,255,.1)}
.voltar{display:flex;align-items:center;gap:4px;font-size:15px;color:var(--marca)}
.item-aula{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px}
.num{width:36px;height:36px;border-radius:999px;display:grid;place-items:center;font-size:14px;font-weight:600;background:rgba(255,255,255,.1);flex-shrink:0}
.num.feito{background:var(--sucesso)}
.player{margin-top:16px;overflow:hidden;border-radius:16px;border:1px solid var(--borda);box-shadow:0 0 30px rgba(30,110,255,.2);aspect-ratio:16/9;background:#000}
.player iframe{width:100%;height:100%;border:0;display:block}
.btn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:12px;font-weight:600}
.btn.azul-bg{background:var(--marca);box-shadow:0 0 18px rgba(30,139,255,.5)}
.btn.concluida{background:rgba(34,197,94,.15);color:var(--sucesso)}
/* materiais */
.grade-mat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.mat{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:16px 12px 12px;border-radius:16px}
.mat .tit{margin-top:12px;font-size:14.5px;font-weight:600;line-height:1.2}
.mat .baixar{position:absolute;right:10px;bottom:10px;width:32px;height:32px;border-radius:999px;background:var(--marca);display:grid;place-items:center;box-shadow:0 0 12px rgba(30,139,255,.6)}
.trava{margin-top:8px;display:flex;align-items:center;gap:6px;border-radius:999px;background:rgba(30,139,255,.15);padding:4px 10px;font-size:12px;font-weight:600;color:var(--marca)}
.aviso{margin-top:16px;display:flex;align-items:center;gap:12px;border-radius:16px;border:1px solid rgba(30,139,255,.3);background:rgba(30,139,255,.1);padding:14px;font-size:14px;line-height:1.4}
/* perfil */
.avatar{position:relative;width:64px;height:64px;flex-shrink:0}
.avatar .circ{width:100%;height:100%;border-radius:999px;overflow:hidden;background:#d4d4d4;display:grid;place-items:center}
.avatar .circ img{width:100%;height:100%;object-fit:cover}
.avatar .cam{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:999px;border:2px solid #0c111c;background:var(--marca);display:grid;place-items:center}
.lista-perfil li+li{border-top:1px solid var(--borda)}
.lista-perfil a,.lista-perfil button{width:100%;display:flex;align-items:center;gap:16px;padding:16px;text-align:left;font-size:15px}
.campo-nome{min-width:0;flex:1;border-radius:12px;border:1px solid var(--marca);background:rgba(255,255,255,.05);padding:10px 12px;font-size:17px;outline:none}
/* folha (bottom sheet) */
.folha-fundo{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.folha{width:100%;max-width:448px;margin:0 auto;border-radius:24px 24px 0 0;padding:24px 24px max(24px,var(--seguro-base))}
.folha h2{font-size:20px;font-weight:700}
.btn-claro{background:rgba(255,255,255,.1)}
/* instalar */
.inst-topo{display:flex;align-items:center;gap:14px}
.inst-topo img{width:56px;height:56px;border-radius:14px;box-shadow:0 0 18px rgba(30,139,255,.35);flex-shrink:0}
.passos{margin-top:18px;display:flex;flex-direction:column;gap:12px}
.passo{display:flex;align-items:flex-start;gap:12px;font-size:15px;line-height:1.45}
.passo .n{width:26px;height:26px;border-radius:999px;background:var(--marca);font-size:13px;font-weight:700;display:grid;place-items:center;flex-shrink:0}
.chip-ic{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;margin:0 2px;width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,.12);color:var(--marca)}
.seta-baixo{display:flex;justify-content:center;margin-top:14px;color:var(--marca);animation:pulo 1.2s ease-in-out infinite}
@keyframes pulo{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
.ib{display:flex;align-items:center;gap:10px;margin:0 0 16px;padding:10px 12px;border-radius:14px;border:1px solid var(--marca);background:#0d1a33}
.ib img{width:36px;height:36px;border-radius:9px;flex-shrink:0}
.ib b{display:block;font-size:14.5px;line-height:1.25}
.ib small{display:block;margin-top:1px;font-size:12px;color:var(--texto-2)}
.ibb{flex-shrink:0;border-radius:12px;background:var(--marca);padding:9px 16px;font-size:13.5px;font-weight:700;color:#fff}
.ibx{flex-shrink:0;padding:6px;color:var(--texto-2)}
.entrar .ib{margin:0 0 20px}
.lista-inst{margin:12px 0;padding-left:20px;list-style:decimal;line-height:1.8;font-size:15px}
.lista-inst li{padding-left:2px}
.lista-inst .chip-ic{width:24px;height:24px}
.aviso-item{display:flex;gap:12px;padding:14px;border-radius:14px}
.aviso-item .ponto{width:9px;height:9px;border-radius:999px;margin-top:6px;flex-shrink:0;background:transparent}
.aviso-item.novo .ponto{background:var(--marca);box-shadow:0 0 8px rgba(30,139,255,.8)}
.aviso-link{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:14px;font-weight:600;color:var(--marca)}
/* entrar */
.entrar{position:relative;display:flex;flex-direction:column;min-height:100dvh;overflow:hidden}
.entrar .topo{position:absolute;left:0;right:0;top:0;height:52dvh}
.entrar .topo img{width:100%;height:100%;object-fit:cover;object-position:62% 20%;opacity:.8}
.entrar .topo i{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,13,.4),rgba(5,7,13,.3) 50%,var(--fundo))}
.entrar .conteudo{position:relative;flex:1;display:flex;flex-direction:column;width:100%;max-width:448px;margin:0 auto;padding:max(24px,var(--seguro-topo)) 24px max(24px,var(--seguro-base))}
.entrar form{margin-top:auto}
.entrar h1{font-size:30px;font-weight:700;line-height:1.2}
.entrar input{width:100%;margin-top:8px;padding:16px;border-radius:16px;font-size:17px;outline:none}
.entrar input:focus{border-color:var(--marca);box-shadow:0 0 0 3px rgba(30,139,255,.25)}
.entrar .btn{margin-top:16px;border-radius:16px;padding:16px;font-size:17px}
.entrar .btn:disabled{opacity:.4;box-shadow:none}
</style>
</head>

// ---------- perfil salvo no aparelho ----------
const CHAVE = "tecnico-iphone:perfil";
const CHAVE_PA = "tecnico-iphone:primeiro-acesso";
function lerPerfil() {
  try {
    const p = JSON.parse(localStorage.getItem(CHAVE) || "null");
    return p && typeof p.nome === "string" ? { concluidas: [], historico: [], ...p } : null;
  } catch { return null; }
}
function gravarPerfil(p, renderizar = true) {
  if (p) localStorage.setItem(CHAVE, JSON.stringify(p)); else localStorage.removeItem(CHAVE);
  if (renderizar) render();
}
function atualizar(mudar, renderizar = true) { const p = lerPerfil(); if (p) gravarPerfil(mudar(p), renderizar); }
function primeiroAcesso(p) {
  let d = localStorage.getItem(CHAVE_PA);
  if (!d || isNaN(Date.parse(d))) { d = p.criadoEm; localStorage.setItem(CHAVE_PA, d); }
  return d;
}
async function prepararFoto(arquivo, lado = 320) {
  const bmp = await createImageBitmap(arquivo);
  const corte = Math.min(bmp.width, bmp.height), t = Math.min(lado, corte);
  const c = document.createElement("canvas"); c.width = c.height = t;
  c.getContext("2d").drawImage(bmp, (bmp.width - corte) / 2, (bmp.height - corte) / 2, corte, corte, 0, 0, t, t);
  bmp.close?.();
  return c.toDataURL("image/jpeg", 0.85);
}

}

const ICONES_MAT = { ferramentas: ["wrench", "var(--marca)"], fornecedores: ["truck", "#7dd3fc"], precos: ["badge-dollar-sign", "#34d399"], diagnostico: ["stethoscope", "var(--marca)"], vidro: ["smartphone", "#7dd3fc"], molhado: ["droplets", "#22d3ee"], whatsapp: ["message-circle", "#4ade80"], instagram: ["camera", "#f472b6"], garantia: ["file-check", "#fbbf24"] };
function falta(m, inicio) { return m.liberaEmDias ? Math.max(0, Date.parse(inicio) + m.liberaEmDias * DIA - Date.now()) : 0; }
function formatarFalta(ms) { const min = Math.ceil(ms / 6e4), d = Math.floor(min / 1440), h = Math.floor((min % 1440) / 60), m = min % 60; return d ? `${d}d ${h}h` : h ? `${h}h ${m}min` : `${m} min`; }
function conteudoMateriais(p) {
  const inicio = primeiroAcesso(p), t = (ui.buscaMat || "").toLowerCase();
  const lista = materiais.filter((m) => (ui.filtroMat === "todos" || m.categoria === ui.filtroMat) && (!t || m.titulo.toLowerCase().includes(t)));
  const pend = materiais.filter((m) => falta(m, inicio) > 0);
  let aviso = "";
  if (pend.length) {
    const d = new Date(Date.now() + Math.min(...pend.map((m) => falta(m, inicio))));
    aviso = `<div class="aviso"><span class="azul">${ic("clock", { s: 20 })}</span><p><b>${pend.length} ${pend.length === 1 ? "material será liberado" : "materiais serão liberados"}</b> em ${d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" })} às ${d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}. Aproveite para avançar nas aulas!</p></div>`;
  }
  const cards = lista.map((m) => {
    const fl = falta(m, inicio), lib = fl === 0, [i, cor] = ICONES_MAT[m.tipo] || ["file-text", "var(--marca)"];
    return `<li class="mat cartao"><span style="color:${lib ? cor : "#737373"}">${ic(i, { s: 42, sw: 1.8 })}</span><p class="tit">${esc(m.titulo)}</p><p class="t2 mt1" style="font-size:12px">${esc(m.tamanho)}</p>
      ${lib ? `<a class="baixar" href="${esc(m.arquivo)}" target="_blank" rel="noopener" aria-label="Abrir ${esc(m.titulo)}">${ic("arrow-down", { s: 18, sw: 2.6 })}</a>` : `<p class="trava">${ic("lock", { s: 12 })} Libera em ${formatarFalta(fl)}</p>`}</li>`;
  }).join("");
  return `${aviso}<ul class="grade-mat">${cards}</ul>${lista.length ? "" : `<p class="t2" style="text-align:center;padding:40px 0">Nenhum material encontrado.</p>`}`;
}
function telaMateriais(p) {
  return `<main>${cabecalho("Materiais", "Acesse materiais complementares para turbinar seus estudos.", "file-text", botaoBusca("busca-mat", ui.buscaMat !== null))}
    ${ui.buscaMat !== null ? `<input class="campo-busca cartao" id="busca-mat" placeholder="Buscar material" value="${esc(ui.buscaMat)}">` : ""}
    ${chips([["todos", "Todos"], ["tecnico", "Técnico"], ["negocio", "Negócio"], ["extras", "Extras"]], ui.filtroMat, "filtro-mat")}
    <div id="conteudo-mat">${conteudoMateriais(p)}</div></main>`;
}

function telaPerfil(p, f) {
  const pg = progressoGeral(f), desde = new Date(p.criadoEm).toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
  const suporte = curso.whatsappSuporte ? `https://wa.me/${curso.whatsappSuporte}` : "#";
  const itens = [["Meus Certificados", "trophy", "#fbbf24", "#/perfil"], ["Configurações", "settings", "#e5e5e5", "#/perfil"], ["Suporte", "headphones", "#e5e5e5", suporte]];
  const cartaoNome = ui.editandoNome
    ? `<form id="form-nome" class="flex g2"><input id="campo-nome" class="campo-nome" maxlength="40" value="${esc(p.nome)}"><button type="submit" class="btn-ic" aria-label="Salvar nome" style="width:40px;height:40px;background:var(--marca)">${ic("check", { s: 18 })}</button><button type="button" class="btn-ic btn-claro" data-acao="cancelar-nome" aria-label="Cancelar" style="width:40px;height:40px">${ic("x", { s: 18 })}</button></form>`
    : `<div class="flex g4"><button class="avatar" data-acao="abrir-foto" aria-label="Alterar foto do perfil"><span class="circ">${p.foto ? `<img src="${p.foto}" alt="">` : `<span style="color:#525252;margin-top:12px">${ic("user", { s: 56, fill: true, sw: 0 })}</span>`}</span><span class="cam">${ic("camera", { s: 12, sw: 2.5 })}</span></button>
        <div class="f1"><p class="trunc" style="font-size:18px;font-weight:600">${esc(p.nome)}</p><p class="trunc t2" style="font-size:14px">Aluno desde ${desde}</p></div>
        <button class="btn-ic btn-claro" data-acao="editar-nome" aria-label="Editar nome" style="width:36px;height:36px">${ic("pencil", { s: 16 })}</button></div>`;
  return `<main>${cabecalho("Perfil", "Gerencie sua conta e acompanhe seu desempenho.", "user")}
    <section class="cartao r-2xl mt6" style="padding:16px">${cartaoNome}${ui.erroFoto ? `<p class="mt3" style="font-size:14px;color:#f87171">${esc(ui.erroFoto)}</p>` : ""}</section>
    <section class="cartao r-2xl flex g4 mt3" style="padding:16px"><span style="color:#fbbf24">${ic("trophy", { s: 40, fill: true, sw: 1.4 })}</span>
      <div class="f1"><p style="font-size:15px;font-weight:500">Seu Progresso Geral</p><div class="flex g3 mt2">${barra(pg.pct)}<span style="font-size:14px;font-weight:500;flex-shrink:0">${pg.pct}%</span></div>
      <p class="t2" style="margin-top:6px;font-size:12px">Conclusão de ${pg.concluidos} de ${pg.total} módulos • ${pg.aulas} de ${pg.totalAulas} aulas</p></div></section>
    <ul class="cartao r-2xl mt3 lista-perfil" style="overflow:hidden">${itens.map(([l, i, cor, h]) => `<li><a href="${h}"${h.startsWith("http") ? ' target="_blank" rel="noopener"' : ""}><span style="color:${cor}">${ic(i, { s: 22 })}</span><span class="f1">${l}</span><span class="t2">${ic("chevron-right", { s: 18 })}</span></a></li>`).join("")}
      ${ehInstalado() ? "" : `<li><button data-acao="abrir-instalar"><span class="azul">${ic("download", { s: 22 })}</span><span class="f1">Instalar o app</span><span class="t2">${ic("chevron-right", { s: 18 })}</span></button></li>`}
      <li><button data-acao="abrir-sair"><span style="color:#f97316">${ic("log-out", { s: 22 })}</span><span class="f1">Sair da Conta</span><span class="t2">${ic("chevron-right", { s: 18 })}</span></button></li></ul>
    <p class="t2 mt4" style="text-align:center;font-size:12px">Acesso completo • dados salvos neste aparelho</p></main>`;
}
function folha(p, f) {
  if (ui.folha === "instalar") return folhaInstalar();
  if (ui.folha === "avisos") return folhaAvisos(p);
  if (ui.folha === "foto") return `<div class="folha-fundo" data-acao="fechar-folha"><div class="folha cartao" data-parar><h2>Foto do perfil</h2><p class="t2 mt1" style="font-size:14px">A foto fica salva só neste aparelho.</p>
    <button class="btn azul-bg mt5" style="border-radius:16px" data-acao="escolher-foto">${ic("image-plus", { s: 20 })} ${p.foto ? "Trocar foto" : "Escolher foto"}</button>
    ${p.foto ? `<button class="btn btn-claro mt2" style="border-radius:16px;color:#f87171" data-acao="remover-foto">${ic("trash", { s: 18 })} Remover foto</button>` : ""}
    <button class="btn btn-claro mt2" style="border-radius:16px" data-acao="fechar-folha">Cancelar</button></div></div>`;
  if (ui.folha === "sair") { const n = progressoGeral(f).aulas; return `<div class="folha-fundo" data-acao="fechar-folha"><div class="folha cartao" data-parar><h2>Sair da conta?</h2>
    <p class="t2 mt2" style="font-size:15px;line-height:1.45">Seu nome e seu progresso (${n} ${n === 1 ? "aula concluída" : "aulas concluídas"}) serão apagados deste aparelho. Isso não pode ser desfeito.</p>
    <button class="btn mt5" style="border-radius:16px;background:rgba(239,68,68,.9)" data-acao="sair">Sair e apagar dados</button>
    <button class="btn btn-claro mt2" style="border-radius:16px" data-acao="fechar-folha">Cancelar</button></div></div>`; }
  return "";
}
const telaNaoEncontrada = () => `<main><p class="t2" style="padding:40px 0;text-align:center">Página não encontrada.</p><a class="btn azul-bg" href="#/">Voltar para o início</a></main>`;

// ---------- roteamento ----------
function rotaAtual() { const [nome = "", param = ""] = location.hash.replace(/^#\/?/, "").split("/"); return { nome, param: decodeURIComponent(param) }; }
let ultimaRota = "";
function render() {
  const { nome, param } = rotaAtual();
  const p = lerPerfil();
  if (!p && nome !== "entrar") { location.replace("#/entrar"); return; }
  if (p && nome === "entrar") { location.replace("#/"); return; }
  const chaveRota = nome + "/" + param;
  if (chaveRota !== ultimaRota) { window.scrollTo(0, 0); ui.folha = null; ui.editandoNome = false; ui.erroFoto = ""; if (nome === "materiais" && param) ui.filtroMat = param; }
  ultimaRota = chaveRota;
  if (!p) {
    const digitado = document.getElementById("nome")?.value || "";
    $app.innerHTML = telaEntrar() + (ui.folha === "instalar" ? folhaInstalar() : "");
    ligarEntrar();
    if (digitado) { const c = document.getElementById("nome"); c.value = digitado; document.getElementById("btn-entrar").disabled = digitado.trim().length < 2; }
    return;
  }
  const f = new Set(p.concluidas);
  const telas = { "": () => telaHome(p, f), aulas: () => telaAulas(p, f), modulo: () => telaModulo(param, f), aula: () => telaAula(param, f), materiais: () => telaMateriais(p), perfil: () => telaPerfil(p, f) };
  const corpo = (telas[nome] || telaNaoEncontrada)();
  $app.innerHTML = `<div class="fundo-app"><div class="tela">${corpo}</div>${nav(nome)}${folha(p, f)}</div>`;
  if (ui.editandoNome) { const c = document.getElementById("campo-nome"); c?.focus(); c?.setSelectionRange(c.value.length, c.value.length); }
}
function ligarEntrar() {
  const campo = document.getElementById("nome"), btn = document.getElementById("btn-entrar");
  campo.addEventListener("input", () => { btn.disabled = campo.value.trim().length < 2; });
  document.getElementById("form-entrar").addEventListener("submit", (e) => {
    e.preventDefault();
    const nome = campo.value.trim();
    if (nome.length < 2) return;
    if (!localStorage.getItem(CHAVE_PA)) localStorage.setItem(CHAVE_PA, new Date().toISOString());
    gravarPerfil({ nome, criadoEm: new Date().toISOString(), concluidas: [], historico: [] }, false);
    location.replace("#/");
  });
  setTimeout(() => campo.focus(), 50);
}

// ---------- ações ----------
document.addEventListener("click", (e) => {
  const alvo = e.target.closest("[data-acao]");
  if (!alvo) return;
  if (e.target.closest("[data-parar]") && alvo.classList.contains("folha-fundo")) return;
  const acao = alvo.dataset.acao, v = alvo.dataset.v;
  const alternar = (slug, renderizar) => atualizar((p) => ({ ...p, concluidas: p.concluidas.includes(slug) ? p.concluidas.filter((s) => s !== slug) : [...p.concluidas, slug] }), renderizar);
  switch (acao) {
    case "filtro-aulas": ui.filtroAulas = v; render(); break;
    case "busca-aulas": ui.buscaAulas = ui.buscaAulas === null ? "" : null; render(); document.getElementById("busca-aulas")?.focus(); break;
    case "filtro-mat": ui.filtroMat = v; render(); break;
    case "busca-mat": ui.buscaMat = ui.buscaMat === null ? "" : null; render(); document.getElementById("busca-mat")?.focus(); break;
    case "concluir": {
      alternar(v, false);
      document.getElementById("botoes-aula").innerHTML = botoesAula(v, new Set(lerPerfil().concluidas));
      break;
    }
    case "concluir-e-seguir": { const p = lerPerfil(); if (p && !p.concluidas.includes(v)) alternar(v, false); break; }
    case "editar-nome": ui.editandoNome = true; render(); break;
    case "cancelar-nome": ui.editandoNome = false; render(); break;
    case "abrir-foto": ui.folha = "foto"; render(); break;
    case "abrir-sair": ui.folha = "sair"; render(); break;
    case "fechar-folha": ui.folha = null; render(); break;
    case "abrir-avisos": ui.folha = "avisos"; render(); break;
    case "abrir-instalar":
    case "instalar": {
      const pr = promptInstalar;
      if (!pr) { ui.folha = "instalar"; render(); break; }
      promptInstalar = null;
      pr.prompt();
      pr.userChoice.then((r) => { if (r && r.outcome === "accepted") localStorage.setItem(CHAVE_INSTALAR, "instalado"); render(); }, () => render());
      break;
    }
    case "fechar-cartao-instalar": localStorage.setItem(CHAVE_INSTALAR, String(Date.now())); render(); break;
    case "copiar-link": {
      const link = location.origin + location.pathname;
      const ok = () => { alvo.innerHTML = `${ic("check", { s: 18 })} Link copiado!`; };
      if (navigator.clipboard) navigator.clipboard.writeText(link).then(ok, () => window.prompt("Copie o link:", link));
      else window.prompt("Copie o link:", link);
      break;
    }
    case "escolher-foto": ui.folha = null; render(); document.getElementById("arquivo-foto").click(); break;
    case "remover-foto": ui.folha = null; atualizar(({ foto, ...resto }) => resto); break;
    case "sair": ui.folha = null; localStorage.removeItem(CHAVE); location.replace("#/entrar"); break;
  }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "busca-aulas") { ui.buscaAulas = e.target.value; document.getElementById("lista-modulos").innerHTML = listaModulos(new Set(lerPerfil().concluidas)); }
  if (e.target.id === "busca-mat") { ui.buscaMat = e.target.value; document.getElementById("conteudo-mat").innerHTML = conteudoMateriais(lerPerfil()); }
});
document.addEventListener("submit", (e) => {
  if (e.target.id !== "form-nome") return;
  e.preventDefault();
  const n = document.getElementById("campo-nome").value.trim();
  if (n.length < 2) return;
  ui.editandoNome = false;
  atualizar((p) => ({ ...p, nome: n }));
});
document.getElementById("arquivo-foto").addEventListener("change", async (e) => {
  const arq = e.target.files?.[0];
  e.target.value = "";
  if (!arq) return;
  ui.erroFoto = "";
  try { const foto = await prepararFoto(arq); atualizar((p) => ({ ...p, foto })); }
  catch { ui.erroFoto = "Não foi possível usar essa imagem. Tente outra foto."; render(); }
});
window.addEventListener("hashchange", render);
window.addEventListener("storage", (e) => { if (e.key === CHAVE) render(); });
setInterval(() => { if (rotaAtual().nome === "materiais") { const el = document.getElementById("conteudo-mat"), p = lerPerfil(); if (el && p) el.innerHTML = conteudoMateriais(p); } }, 30000);
render();
</script>
</body>
</html>
